name: Build docker image

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --all-features

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  Build-Docker-Image:
    needs: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          tags: ghcr.io/${{ env.IMAGE }}:latest,ghcr.io/${{ env.IMAGE }}:${{ github.sha }}
          context: .
          file: ./docker/build.dockerfile

      - name: Invoke deployment hook
        if: github.event_name == 'push'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: curl -fsS --retry 3 --max-time 30 -X POST "${WEBHOOK_URL}?MEILIE_UPDATER_TAG=${GITHUB_SHA}"
